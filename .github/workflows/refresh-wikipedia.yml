# Тегли олимпийските таблици от Уикипедия и комитва резултата.
#
# Нарочно е ОТДЕЛЕН от билда: сайтът се билдва от записания JSON и не зависи
# от мрежата. Ако Уикипедия е недостъпна, сайтът пак се качва — просто с
# по-старите данни.
name: Refresh data from Wikipedia

on:
  workflow_dispatch:
  schedule:
    # Веднъж месечно, първо число в 4:20 UTC. Олимпийските таблици са
    # исторически и не се менят — това е само за да не изгние скриптът.
    - cron: '20 4 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parser tests, offline
        run: node scripts/test/medal-table.test.mjs

      # Едно пускане, не две: първият пробег правеше двайсет заявки за осем
      # секунди и Уикипедия върна 429 на всичките. Репортът се печата и така.
      - name: Fetch and write
        run: node scripts/fetch-wikipedia.mjs

      - name: Show what changed
        run: |
          git --no-pager diff --stat
          echo '--- първият файл, за проверка на очи ---'
          head -30 src/data/wikipedia/winter-2022.json || true

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain src/data/wikipedia)" ]; then
            echo 'Нищо ново.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/wikipedia
          git commit -m 'chore(data): refresh Olympic medal tables from Wikipedia'
          git push
